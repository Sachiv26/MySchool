services:
  db:
    image: postgres:16-alpine
    container_name: myschool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myschool
      POSTGRES_PASSWORD: myschool
      POSTGRES_DB: myschool
    ports:
      - "5432:5432"
    volumes:
      - myschool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myschool -d myschool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  myschool_pgdata: